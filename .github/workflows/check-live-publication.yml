name: Check live publication

on:
  pull_request:
    paths:
      - "scripts/check_live_publication.py"
      - "tests/test_live_publication.py"
      - ".github/workflows/check-live-publication.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 21 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/check_live_publication.py"
      - "tests/test_live_publication.py"
      - "releases/ssa-ontology/v0.1.0/**"
      - "docs/website/verification-status.json"
      - ".github/workflows/check-live-publication.yml"

permissions:
  contents: read

concurrency:
  group: check-live-publication-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-live-publication:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Offline regression tests for related public route observations
        run: python -m unittest discover -s tests -p "test_live_publication.py" -v

      - name: Read-only Index Line public diagnostics (PR branch, no release)
        if: github.event_name == 'pull_request'
        run: python scripts/check_live_publication.py --related-index-line-only

      - name: Check live publication and hosted release integrity
        if: github.event_name != 'pull_request'
        run: python scripts/check_live_publication.py

      - name: Read back Index Line observations against this exact run and source revision
        if: always() && github.event_name != 'pull_request'
        run: python scripts/check_live_publication.py --verify-index-line-receipt

      - name: Retain machine-readable hosted artifact integrity receipt
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ssa-hosted-artifact-integrity-${{ github.run_id }}
          path: docs/website/hosted-artifact-integrity-runtime.json
          if-no-files-found: error
          retention-days: 7

      - name: Download retained Index Line receipt for exact artifact readback
        if: always() && github.event_name != 'pull_request'
        uses: actions/download-artifact@v4
        with:
          name: ssa-hosted-artifact-integrity-${{ github.run_id }}
          path: ${{ runner.temp }}/index-line-retained-receipt

      - name: Verify retained Index Line receipt matches producing bytes
        if: always() && github.event_name != 'pull_request'
        shell: bash
        run: |
          cmp --silent docs/website/hosted-artifact-integrity-runtime.json \
            "${{ runner.temp }}/index-line-retained-receipt/hosted-artifact-integrity-runtime.json" || {
              echo "Persisted artifact is missing or differs from the producing receipt" >&2
              exit 1
            }
          echo "Retained Index Line receipt matches producing bytes."
          receipt_sha="$(sha256sum "${{ runner.temp }}/index-line-retained-receipt/hosted-artifact-integrity-runtime.json" | cut -d ' ' -f1)"
          {
            echo "### The Index Line — retained artifact integrity"
            echo ""
            echo "- GitHub run ID: \`${GITHUB_RUN_ID}\`"
            echo "- Source revision: \`${GITHUB_SHA}\`"
            echo "- Retained artifact SHA-256: \`${receipt_sha}\`"
            echo "- Transport verification: \`BYTES_MATCH_PRODUCER\`"
            echo "- Boundary: technical artifact evidence only; editorial approval, domain and Oncord remain separately governed."
          } >> "${GITHUB_STEP_SUMMARY}"
