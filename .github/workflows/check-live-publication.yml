name: Check live publication

on:
  pull_request:
    paths:
      - "scripts/check_live_publication.py"
      - "tests/test_live_publication.py"
      - ".github/workflows/check-live-publication.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 21 * * *"
  push:
    branches:
      - main
    paths:
      - "scripts/check_live_publication.py"
      - "tests/test_live_publication.py"
      - "releases/ssa-ontology/v0.1.0/**"
      - "docs/website/verification-status.json"
      - ".github/workflows/check-live-publication.yml"

permissions:
  contents: read

concurrency:
  group: check-live-publication-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-live-publication:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Offline regression tests for related public route observations
        run: python -m unittest discover -s tests -p "test_live_publication.py" -v

      - name: Read-only Index Line public diagnostics (PR branch, no release)
        if: github.event_name == 'pull_request'
        run: python scripts/check_live_publication.py --related-index-line-only

      - name: Check live publication and hosted release integrity
        if: github.event_name != 'pull_request'
        run: python scripts/check_live_publication.py

      - name: Retain machine-readable hosted artifact integrity receipt
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ssa-hosted-artifact-integrity-${{ github.run_id }}
          path: docs/website/hosted-artifact-integrity-runtime.json
          if-no-files-found: error
          retention-days: 7
